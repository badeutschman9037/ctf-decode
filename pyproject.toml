[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-decode"
version = "1.0.0"
description = "Quick decoders for common CTF encodings (base64, hex, binary, URL, ROT-N)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Brenden Deutschman" }]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ctf-decode = "ctfdecode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
